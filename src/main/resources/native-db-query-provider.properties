# Opt-in read-only database provider. Java owns SQL and business logic; Rust owns Dubbo transport.
sample.provider.engine=native
reactor.dubbo.registry-enabled=false
dubbo.provider.host=0.0.0.0
dubbo.provider.bind-host=0.0.0.0
dubbo.provider.port=20880
sample.native-provider.io-workers=1
sample.native-provider.business-workers=2
sample.native-provider.queue-capacity=16
sample.native-provider.max-payload-bytes=262144
sample.native-provider.request-timeout-ms=5000
sample.native-provider.drain-timeout-ms=5000
sample.native-provider.max-collection-items=1024
sample.native-provider.service-max-concurrent=2
sample.db.jdbc-url=jdbc:postgresql://127.0.0.1:15432/reactor_sample
sample.db.username=reactor
sample.db.password=reactor
sample.db.driver-class-name=org.postgresql.Driver
sample.db.read-only=true
sample.db.maximum-pool-size=2
sample.db.minimum-idle=1
sample.db.schema-init=false
